apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-api
  namespace: api
  annotations:
    # public subnet に インターネット向け ALB を作成する
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pod IP へ直接転送 (NodePort を経由しない)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    # 同一グループの Ingress で ALB を共有する場合に指定
    alb.ingress.kubernetes.io/group.name: sample-api
    #
    # --- HTTPS を使う場合は上の listen-ports を置き換えてコメントを外す ---
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:123456789012:certificate/xxxx
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  # chart がデフォルトで作成する IngressClass
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-api
                port:
                  number: 80
