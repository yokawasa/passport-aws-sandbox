apiVersion: v1
kind: Service
metadata:
  name: sample-api
  namespace: api
  labels:
    app: sample-api
spec:
  # ALB は target-type: ip で Pod に直接ルーティングするため ClusterIP で十分
  type: ClusterIP
  selector:
    app: sample-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
